name: Stockbit
description: Stockbit (PT Stockbit Sekuritas Digital) is an Indonesian retail-investing
  platform and social community for the Indonesia Stock Exchange (IDX), letting members
  discuss, analyze, and trade stocks with real-time market data, fundamentals, trading
  ideas, news, and sentiment. The product is delivered as consumer iOS and Android
  apps plus a web experience, with a separate crypto brand (Stockbit Crypto). It was
  surfaced as a portfolio company of 500 Global. As of this enrichment pass Stockbit
  publishes no public developer API, developer portal, OpenAPI/Swagger definition,
  SDK, or .well-known discovery surface — the profile is maintained as a consumer-app
  company record rather than an API provider.
